name = "cloudstudio-keepalive"
main = "start.js"
compatibility_date = "2024-12-01"
# worker scheduled() 自调用 /heart/* 必须开这个兼容标志
compatibility_flags = ["global_fetch_strictly_public"]

[triggers]
crons = ["* * * * *"]

# 非敏感 Vars 由 deploy.yml 自动写入:
#   SPACE_KEYS    必填仓库 Actions 变量,经校验后写入;仅保活明确选中的空间
#   KEEPALIVE_HOST  worker 入口域名,如 "https://keepalive.example.com"
# Secrets 由 deploy.yml 自动写入(TENCENT_SECRET_ID / TENCENT_SECRET_KEY)
[vars]
# 真实 Stop→Run 会中断业务;验收自启链、持久化与维护窗口后才改成 "true"。
DAILY_RESTART_ENABLED = "false"
