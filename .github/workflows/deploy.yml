name: Keepalive Deploy

on:
  workflow_dispatch:
    inputs:
      skip_vps:
        description: "跳过 VPS 部署(只部署 Cloudflare Worker)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "vps/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: keepalive-deploy
  cancel-in-progress: true

jobs:
  deploy-worker:
    name: Cloudflare Worker + 自定义域路由
    runs-on: ubuntu-latest
    outputs:
      keepalive_host: ${{ steps.host.outputs.host }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析入口域名
        id: host
        env:
          KEEPALIVE_DOMAIN: ${{ secrets.KEEPALIVE_DOMAIN }}
        run: echo "host=https://${KEEPALIVE_DOMAIN#https://}" >> "$GITHUB_OUTPUT"

      - name: 写入 wrangler vars
        working-directory: worker
        env:
          SPACE_KEYS: ${{ vars.SPACE_KEYS || 'udfxel' }}
          KEEPALIVE_HOST: ${{ steps.host.outputs.host }}
        run: |
          cat >> wrangler.toml <<EOF
          SPACE_KEYS = "${SPACE_KEYS}"
          KEEPALIVE_HOST = "${KEEPALIVE_HOST}"
          EOF
          echo "--- wrangler.toml ---"; cat wrangler.toml

      - name: 部署 Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy

      - name: 写入 Secrets(forever token / browserless / 腾讯云密钥)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          SPACE_KEYS: ${{ vars.SPACE_KEYS || 'udfxel' }}
          KEEPALIVE_HOST: ${{ steps.host.outputs.host }}
          FOREVER_TOKEN: ${{ secrets.FOREVER_TOKEN }}
          BROWSERLESS_KEY: ${{ secrets.BROWSERLESS_KEY }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: |
          first=$(echo "$SPACE_KEYS" | cut -d, -f1 | tr '[:lower:]' '[:upper:]')
          echo -n "$FOREVER_TOKEN" | npx --yes wrangler@latest secret put "FOREVER_TOKEN_${first}"
          # 多空间:为每个 spaceKey 复用同一个 token 的用户,自行加 secret put FOREVER_TOKEN_<KEY>
          [ -n "$BROWSERLESS_KEY" ] && echo -n "$BROWSERLESS_KEY" | npx --yes wrangler@latest secret put BROWSERLESS_KEY || true
          [ -n "$TENCENT_SECRET_ID" ] && echo -n "$TENCENT_SECRET_ID" | npx --yes wrangler@latest secret put TENCENT_SECRET_ID || true
          [ -n "$TENCENT_SECRET_KEY" ] && echo -n "$TENCENT_SECRET_KEY" | npx --yes wrangler@latest secret put TENCENT_SECRET_KEY || true

      - name: 绑定自定义域路由(workers.dev 被污染,必须自定义域)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          KEEPALIVE_DOMAIN: ${{ secrets.KEEPALIVE_DOMAIN }}
        run: |
          bash .github/scripts/bind-route.sh

      - name: 验证心跳入口
        env:
          HOST: ${{ steps.host.outputs.host }}
          SPACE_KEYS: ${{ vars.SPACE_KEYS || 'udfxel' }}
        run: |
          first=$(echo "$SPACE_KEYS" | cut -d, -f1)
          echo "--- GET $HOST/heart/$first ---"
          code=$(curl -s -o /tmp/heart.json -w "%{http_code}" --max-time 30 "$HOST/heart/$first")
          echo "HTTP $code"; head -c 400 /tmp/heart.json; echo
          if [ "$code" != "200" ]; then echo "⚠️ 心跳返回非 200,检查 FOREVER_TOKEN 是否有效"; exit 1; fi

  deploy-vps:
    name: VPS 启动链 + preview.yml
    runs-on: ubuntu-latest
    needs: deploy-worker
    if: ${{ inputs.skip_vps != true }}
    steps:
      - uses: actions/checkout@v4

      - name: 准备 SSH(密钥优先,回退密码)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
            ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
            echo "SSH_AUTH=key" >> "$GITHUB_ENV"
          else
            sudo apt-get install -y -qq sshpass > /dev/null
            echo "SSH_AUTH=password" >> "$GITHUB_ENV"
          fi

      - name: 解析网关真实 IP(runner 本地 DNS 查不到腾讯 CNAME,走 DoH,写 /etc/hosts)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          IP=$(curl -s --max-time 20 "https://dns.google/resolve?name=${SSH_HOST}&type=A" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(a['data'] for a in d['Answer'] if a['type']==1))")
          echo "gateway $SSH_HOST -> $IP"
          if [ -z "$IP" ]; then echo "DoH 解析失败"; exit 1; fi
          echo "$IP $SSH_HOST" | sudo tee -a /etc/hosts > /dev/null

      - name: 上传脚本 + 写 preview.yml 启动链
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          APP_DIR: /workspace/programming-language-demo
        run: |
          ssh_run() {
            if [ "$SSH_AUTH" = "key" ]; then ssh -o ConnectTimeout=30 "$SSH_USER@$SSH_HOST" "$1"
            else sshpass -p "$SSH_PASSWORD" ssh -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=keyboard-interactive,password "$SSH_USER@$SSH_HOST" "$1"; fi
          }
          scp_file() { # scp 对 CloudStudio 网关必须加 -O(legacy 协议)
            if [ "$SSH_AUTH" = "key" ]; then scp -O "$1" "$SSH_USER@$SSH_HOST:$2"
            else sshpass -p "$SSH_PASSWORD" scp -O -o StrictHostKeyChecking=accept-new "$1" "$SSH_USER@$SSH_HOST:$2"; fi
          }

          echo "[1/4] 建目录"
          ssh_run "mkdir -p $APP_DIR/apps/new-api $APP_DIR/.vscode /tmp/kdeploy"

          echo "[2/4] 上传 vps/ 脚本"
          for f in restore-assets.sh boot-all.sh tunnel-start.sh probe-start.sh selfheal.sh selfheal-start.sh; do
            scp_file "vps/$f" "$APP_DIR/apps/new-api/$f" || exit 1
          done

          echo "[3/4] 写 preview.yml(autoOpen 启动链)"
          scp_file "vps/preview.yml" "$APP_DIR/.vscode/preview.yml" || exit 1

          echo "[4/4] 立即执行启动链(不等凌晨 4 点)"
          ssh_run "cd $APP_DIR/apps/new-api && chmod +x *.sh && bash restore-assets.sh && bash boot-all.sh && bash tunnel-start.sh && (bash probe-start.sh || true) && bash selfheal-start.sh; sleep 8; echo '--- 进程 ---'; ps aux | grep -E 'new-api|cloudflared|cf-probe' | grep -v grep | awk '{print \$11}' | sort | uniq -c; echo '--- 本地 3000 ---'; curl -s -o /dev/null -w 'HTTP %{http_code}\n' http://localhost:3000/ || true"

  summary:
    name: 部署摘要
    runs-on: ubuntu-latest
    needs: [deploy-worker, deploy-vps]
    if: always()
    steps:
      - name: 输出结果
        run: |
          echo "## 部署结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 步骤 | 状态 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cloudflare Worker | ${{ needs.deploy-worker.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| VPS 启动链 | ${{ needs.deploy-vps.result }} |" >> "$GITHUB_STEP_SUMMARY"
