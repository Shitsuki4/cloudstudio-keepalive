name: Keepalive Deploy

on:
  workflow_dispatch:
    inputs:
      skip_vps:
        description: "跳过 VPS 部署(只部署 Cloudflare Worker)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "vps/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: keepalive-deploy
  cancel-in-progress: true

jobs:
  deploy-worker:
    name: Cloudflare Worker + 自定义域路由
    runs-on: ubuntu-latest
    outputs:
      space_first: ${{ steps.discover.outputs.first }}
      has_ssh: ${{ steps.sshcheck.outputs.has_ssh }}
    steps:
      - uses: actions/checkout@v4

      - name: 探测是否配置了 SSH(决定 VPS job 是否运行)
        id: sshcheck
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: echo "has_ssh=$([ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

      # ── 0. 用腾讯云密钥自动发现 spaceKey ──
      - name: 自动发现工作区 spaceKey
        id: discover
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: python3 .github/scripts/tc-discover.py

      # ── 1. Global API Key → 铸临时 token + 自动发现 account/zone ──
      - name: 铸临时 CF token(Global Key 方式)
        id: mint
        env:
          CF_AUTH_EMAIL: ${{ secrets.CF_AUTH_EMAIL }}
          CF_GLOBAL_API_KEY: ${{ secrets.CF_GLOBAL_API_KEY }}
          KEEPALIVE_DOMAIN: ${{ secrets.KEEPALIVE_DOMAIN }}
        run: python3 .github/scripts/cf-token.py

      - name: 解析入口域名
        id: host
        env:
          KEEPALIVE_DOMAIN: ${{ secrets.KEEPALIVE_DOMAIN }}
        run: echo "host=https://${KEEPALIVE_DOMAIN#https://}" >> "$GITHUB_OUTPUT"

      - name: 写入 wrangler vars
        working-directory: worker
        env:
          SPACE_KEYS: ${{ steps.discover.outputs.space_keys }}
          KEEPALIVE_HOST: ${{ steps.host.outputs.host }}
        run: |
          cat >> wrangler.toml <<EOF
          SPACE_KEYS = "${SPACE_KEYS}"
          KEEPALIVE_HOST = "${KEEPALIVE_HOST}"
          EOF
          echo "--- wrangler.toml ---"; cat wrangler.toml

      - name: 部署 Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.mint.outputs.token }}
        run: npx --yes wrangler@latest deploy

      - name: 写入 Worker Secrets(腾讯云密钥)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ steps.mint.outputs.token }}
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          BROWSERLESS_KEY: ${{ secrets.BROWSERLESS_KEY }}
        run: |
          echo -n "$TENCENT_SECRET_ID"  | npx --yes wrangler@latest secret put TENCENT_SECRET_ID
          echo -n "$TENCENT_SECRET_KEY" | npx --yes wrangler@latest secret put TENCENT_SECRET_KEY
          [ -n "$BROWSERLESS_KEY" ] && echo -n "$BROWSERLESS_KEY" | npx --yes wrangler@latest secret put BROWSERLESS_KEY || true

      - name: 绑定自定义域路由(workers.dev 被污染,必须自定义域)
        env:
          CF_API_TOKEN: ${{ steps.mint.outputs.token }}
          CF_ZONE_ID: ${{ steps.mint.outputs.zone_id }}
          CF_ACCOUNT_ID: ${{ steps.mint.outputs.account_id }}
          KEEPALIVE_DOMAIN: ${{ secrets.KEEPALIVE_DOMAIN }}
        run: bash .github/scripts/bind-route.sh

      - name: 验证心跳入口(TC3 签名)
        env:
          HOST: ${{ steps.host.outputs.host }}
          SPACE: ${{ steps.discover.outputs.first }}
        run: |
          echo "--- GET $HOST/heart/$SPACE ---"
          code=$(curl -s -o /tmp/heart.json -w "%{http_code}" --max-time 45 "$HOST/heart/$SPACE")
          echo "HTTP $code"; head -c 400 /tmp/heart.json; echo
          if [ "$code" != "200" ]; then echo "❌ 心跳失败:检查 TENCENT_SECRET_ID/KEY 与 spaceKey 是否匹配"; exit 1; fi

      - name: 清理临时 token
        if: always()
        env:
          CF_AUTH_EMAIL: ${{ secrets.CF_AUTH_EMAIL }}
          CF_GLOBAL_API_KEY: ${{ secrets.CF_GLOBAL_API_KEY }}
          TOKEN_ID: ${{ steps.mint.outputs.token_id }}
        run: |
          [ -n "$TOKEN_ID" ] || { echo "no token to clean"; exit 0; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
            -H "X-Auth-Email: $CF_AUTH_EMAIL" -H "X-Auth-Key: $CF_GLOBAL_API_KEY" \
            "https://api.cloudflare.com/client/v4/user/tokens/$TOKEN_ID")
          echo "delete temp token: HTTP $code"

  deploy-vps:
    name: VPS 启动链 + preview.yml(可选)
    runs-on: ubuntu-latest
    needs: deploy-worker
    if: ${{ inputs.skip_vps != true && needs.deploy-worker.outputs.has_ssh == '1' }}
    steps:
      - uses: actions/checkout@v4

      # CloudStudio 网关:accessToken 嵌在用户名里即凭证,keyboard-interactive 零提示放行
      # 无需密码/密钥;但绝不能加 BatchMode(会禁用交互通道直接失败)
      - name: 解析网关真实 IP(runner 本地 DNS 查不到腾讯 CNAME,走 DoH,写 /etc/hosts)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          IP=$(curl -s --max-time 20 "https://dns.google/resolve?name=${SSH_HOST}&type=A" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(a['data'] for a in d['Answer'] if a['type']==1))")
          echo "gateway $SSH_HOST -> $IP"
          if [ -z "$IP" ]; then echo "DoH 解析失败"; exit 1; fi
          echo "$IP $SSH_HOST" | sudo tee -a /etc/hosts > /dev/null

      - name: 上传脚本 + 写 preview.yml 启动链
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          SSHOPT="-o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=keyboard-interactive"

          # 网关对频繁新建连接不稳:全部文件走单条 ssh 连接 tar 管道一次传完,失败重试一次
          upload() {
            ssh $SSHOPT "$SSH_USER@$SSH_HOST" "mkdir -p /workspace/programming-language-demo/apps/new-api /workspace/.vscode /workspace/programming-language-demo/.vscode /tmp/kdeploy"
            tar -C vps -cf - restore-assets.sh boot-all.sh tunnel-start.sh probe-start.sh selfheal.sh selfheal-start.sh preview.yml \
              | ssh $SSHOPT "$SSH_USER@$SSH_HOST" "tar -C /tmp/kdeploy -xf -"
            ssh $SSHOPT "$SSH_USER@$SSH_HOST" "install -m755 /tmp/kdeploy/*.sh /workspace/programming-language-demo/apps/new-api/ && install -m644 /tmp/kdeploy/preview.yml /workspace/.vscode/preview.yml && install -m644 /tmp/kdeploy/preview.yml /workspace/programming-language-demo/.vscode/preview.yml"
          }

          echo "[1/3] 上传 vps/ 脚本 + preview.yml(单连接)"
          upload || { echo "首次上传失败,10s 后重试"; sleep 10; upload; }

          echo "[2/3] 立即执行启动链(不等凌晨 4 点)"
          ssh_run() { ssh $SSHOPT "$SSH_USER@$SSH_HOST" "$1"; }
          ssh_run "cd /workspace/programming-language-demo/apps/new-api && chmod +x *.sh && bash restore-assets.sh && bash boot-all.sh && bash tunnel-start.sh && (bash probe-start.sh || true) && bash selfheal-start.sh; sleep 8; echo '--- 进程 ---'; ps aux | grep -E 'new-api|cloudflared|cf-probe|selfheal' | grep -v grep | awk '{print \$11}' | sort | uniq -c; echo '--- 本地 3000 ---'; curl -s -o /dev/null -w 'HTTP %{http_code}\n' http://localhost:3000/ || true"

  summary:
    name: 部署摘要
    runs-on: ubuntu-latest
    needs: [deploy-worker, deploy-vps]
    if: always()
    steps:
      - name: 输出结果
        run: |
          echo "## 部署结果" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 步骤 | 状态 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Cloudflare Worker | ${{ needs.deploy-worker.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| VPS 启动链 | ${{ needs.deploy-vps.result == 'skipped' && '跳过(未配置 SSH 或勾了 skip_vps)' || needs.deploy-vps.result }} |" >> "$GITHUB_STEP_SUMMARY"

  cleanup-summary:
    name: 说明
    runs-on: ubuntu-latest
    needs: [deploy-worker]
    if: always()
    steps:
      - run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## 说明
          - 部署用的临时 CF token 已在部署后自动删除,只留 Global API Key 作为长期凭证
          - spaceKey 由腾讯云密钥调 DescribeWorkspaces 自动发现,无需手填
          - VPS 部署是可选的:Settings 里没有 SSH_HOST 就自动跳过
          EOF
