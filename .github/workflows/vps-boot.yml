name: Keepalive VPS Boot

# 每小时 SSH 进工作区,同步脚本 + 幂等执行启动链(取代 browserless 打开网页 IDE):
# - /workspace 跨重建幸存,但软链(/usr/local/bin 等)和进程全没了 → restore-assets + selfheal 重新拉起
# - SSH 免密:accessToken 嵌在用户名里即凭证(SSH_USER),不能加 BatchMode
# - 未配置 SSH_HOST/SSH_USER 时静默跳过(步骤级判断,job 级 if 引用不了 secrets)
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *" # 每小时 :07(UTC);北京 4 点重启窗口(20:0x UTC)过后自然恢复

jobs:
  boot:
    name: SSH 启动链(幂等)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查 SSH 配置
        id: sshcheck
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: echo "ok=$([ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"

      - name: 解析网关真实 IP(runner DNS 查不到腾讯 CNAME,走 DoH 写 /etc/hosts)
        if: steps.sshcheck.outputs.ok == '1'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          IP=$(curl -s --max-time 20 "https://dns.google/resolve?name=${SSH_HOST}&type=A" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(a['data'] for a in d['Answer'] if a['type']==1))")
          echo "gateway $SSH_HOST -> $IP"
          if [ -z "$IP" ]; then echo "DoH 解析失败"; exit 1; fi
          echo "$IP $SSH_HOST" | sudo tee -a /etc/hosts > /dev/null

      - name: 同步脚本 + 执行启动链
        if: steps.sshcheck.outputs.ok == '1'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          SSHOPT="-o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=keyboard-interactive"
          ssh_run() { ssh $SSHOPT "$SSH_USER@$SSH_HOST" "$1"; }
          scp_file() { scp -O -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new "$1" "$SSH_USER@$SSH_HOST:$2"; }

          # 连接重试:工作区可能正在重启(心跳 Worker 会拉起,不硬失败)
          ssh_run "echo connected" || { echo "SSH 失败,60s 后重试(工作区可能重启中)"; sleep 60; \
            ssh_run "echo connected" || { echo "SSH 仍失败 — 工作区已停止,等心跳拉起后下小时自动恢复"; exit 0; }; }

          echo "[1/3] 同步脚本(每次覆盖,保持与仓库一致)"
          ssh_run "mkdir -p /workspace/programming-language-demo/apps/new-api /workspace/programming-language-demo/.vscode"
          for f in restore-assets.sh boot-all.sh tunnel-start.sh probe-start.sh selfheal.sh selfheal-start.sh; do
            scp_file "vps/$f" "/workspace/programming-language-demo/apps/new-api/$f" || exit 1
          done
          scp_file "vps/preview.yml" "/workspace/programming-language-demo/.vscode/preview.yml" || exit 1

          echo "[2/3] 执行启动链(幂等)"
          ssh_run "cd /workspace/programming-language-demo/apps/new-api && chmod +x *.sh && bash restore-assets.sh && bash boot-all.sh && bash tunnel-start.sh && (bash probe-start.sh || true) && bash selfheal-start.sh"

          echo "[3/3] 状态"
          ssh_run "ps aux | grep -E 'new-api|cloudflared|cf-probe|selfheal' | grep -v grep | awk '{print \$11}' | sort | uniq -c; curl -s -o /dev/null -w 'localhost:3000 HTTP %{http_code}\n' --max-time 5 http://localhost:3000/ || true"
