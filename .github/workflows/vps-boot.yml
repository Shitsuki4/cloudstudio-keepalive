name: Keepalive VPS Boot

# 每小时恢复工作区服务(容器重建后进程清零,只有 /workspace 幸存):
#
# 主通道:runner 自带 Chrome + 云 API 铸的 workspace token 打开网页 IDE
#   → 触发 preview.yml autoOpen → 启动链(restore→boot→tunnel→probe→selfheal)
#   不依赖 browserless(付费)也不依赖 SSH accessToken(7 天轮换)
# 终端通道(可选):通过 Worker /ide/<space> 端点打开网页终端,直接执行命令读回输出,
#   同步脚本 + 直查状态,彻底取代 SSH(免 accessToken 轮换)。失败不阻塞主通道
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *" # 每小时 :07(UTC)

jobs:
  boot:
    name: IDE autoOpen 启动链 + 终端同步(可选)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 铸 workspace token(腾讯云密钥 TC3)
        id: mint
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: python3 .github/scripts/tc-wtoken.py

      - name: 打开网页 IDE 触发 autoOpen 启动链(runner Chrome,免 browserless)
        env:
          SPACE: ${{ steps.mint.outputs.space }}
          TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          npm install --no-save puppeteer-core@23 > /dev/null 2>&1
          node .github/scripts/open-ide.js "$SPACE" "$TOKEN" "$(which google-chrome)"

      - name: 终端通道同步脚本 + 直查状态(免 SSH,失败不阻塞)
        id: ideexec
        continue-on-error: true
        env:
          KEEPALIVE_DOMAIN: ${{ secrets.KEEPALIVE_DOMAIN }}
          SPACE: ${{ steps.mint.outputs.space }}
        run: |
          DOMAIN="${KEEPALIVE_DOMAIN#https://}"
          node .github/scripts/ide-exec.js "https://$DOMAIN/ide/$SPACE" "$(which google-chrome)" \
            --cmd "cd /workspace/programming-language-demo/apps/new-api && chmod +x *.sh 2>/dev/null; ps aux | grep -E 'new-api|cloudflared|cf-probe|selfheal' | grep -v grep | awk '{print \$11}' | sort | uniq -c; curl -s -o /dev/null -w 'localhost:3000 HTTP %{http_code}\n' --max-time 5 http://localhost:3000/ || true" \
            --expect "HTTP"
