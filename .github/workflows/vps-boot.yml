name: Keepalive VPS Boot

# 每小时恢复工作区服务(容器重建后进程清零,只有 /workspace 幸存):
#
# 主通道:runner 自带 Chrome + 云 API 铸的 workspace token 打开网页 IDE
#   → 触发 preview.yml autoOpen → 启动链(restore→boot→tunnel→probe→selfheal)
#   不依赖 browserless(付费)也不依赖 SSH accessToken(7 天轮换)
# 辅通道(可选):免密 SSH 同步脚本 + 直查状态。token 轮换后连不上也不影响主通道
on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *" # 每小时 :07(UTC)

jobs:
  boot:
    name: IDE autoOpen 启动链 + SSH 同步(可选)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 铸 workspace token(腾讯云密钥 TC3)
        id: mint
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: python3 .github/scripts/tc-wtoken.py

      - name: 打开网页 IDE 触发 autoOpen 启动链(runner Chrome,免 browserless)
        env:
          SPACE: ${{ steps.mint.outputs.space }}
          TOKEN: ${{ steps.mint.outputs.token }}
        run: |
          npm install --no-save puppeteer-core@23 > /dev/null 2>&1
          node .github/scripts/open-ide.js "$SPACE" "$TOKEN" "$(which google-chrome)"

      - name: SSH 同步脚本(可选,token 7 天轮换;连不上不阻塞)
        id: sshsync
        continue-on-error: true
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          [ -n "$SSH_HOST" ] && [ -n "$SSH_USER" ] || { echo "未配置 SSH,跳过同步"; exit 0; }
          IP=$(curl -s --max-time 20 "https://dns.google/resolve?name=${SSH_HOST}&type=A" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(a['data'] for a in d['Answer'] if a['type']==1))")
          echo "$IP $SSH_HOST" | sudo tee -a /etc/hosts > /dev/null

          SSHOPT="-o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new -o PreferredAuthentications=keyboard-interactive"
          ssh_run() { ssh $SSHOPT "$SSH_USER@$SSH_HOST" "$1"; }
          scp_file() { scp -O -o ConnectTimeout=30 -o StrictHostKeyChecking=accept-new "$1" "$SSH_USER@$SSH_HOST:$2"; }

          ssh_run "echo connected" || { echo "SSH 连不上(accessToken 可能已轮换)— 主通道不受影响,提醒更新 SSH_USER"; exit 0; }

          echo "[1/2] 同步脚本"
          ssh_run "mkdir -p /workspace/programming-language-demo/apps/new-api /workspace/.vscode /workspace/programming-language-demo/.vscode"
          for f in restore-assets.sh boot-all.sh tunnel-start.sh probe-start.sh selfheal.sh selfheal-start.sh; do
            scp_file "vps/$f" "/workspace/programming-language-demo/apps/new-api/$f" || exit 1
          done
          # preview.yml 两处都放:tty 直开时 workspaceFolders[0]=/workspace,控制台打开项目时是子目录
          scp_file "vps/preview.yml" "/workspace/.vscode/preview.yml" || exit 1
          scp_file "vps/preview.yml" "/workspace/programming-language-demo/.vscode/preview.yml" || exit 1

          echo "[2/2] 状态"
          ssh_run "cd /workspace/programming-language-demo/apps/new-api && chmod +x *.sh && ps aux | grep -E 'new-api|cloudflared|cf-probe|selfheal' | grep -v grep | awk '{print \$11}' | sort | uniq -c; curl -s -o /dev/null -w 'localhost:3000 HTTP %{http_code}\n' --max-time 5 http://localhost:3000/ || true"
