name: debug-dns
on: workflow_dispatch
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "--- getent ---"; getent hosts udfxel.88q5n6vn.ssh.cloudstudio.work || echo NO_A
          echo "--- google DoH ---"; curl -s "https://dns.google/resolve?name=udfxel.88q5n6vn.ssh.cloudstudio.work&type=A" || echo DOH_FAIL
          echo "--- resolv.conf ---"; cat /etc/resolv.conf
          echo "--- try ssh TCP 443 direct google dns ok? ---"
          curl -sI --max-time 8 https://dns.google | head -1