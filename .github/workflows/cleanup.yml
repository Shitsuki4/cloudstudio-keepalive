name: Keepalive Cleanup (临时验收)

# 验收用:清空 CloudStudio + Cloudflare 全部产物,还原初始环境。用完即删。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    name: 还原初始环境(工作区 → CF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 发现 spaceKey
        id: discover
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
        run: python3 .github/scripts/tc-discover.py

      # 先清工作区(此时 Worker 还在,能走 /ide 终端通道)
      - name: 清理 CloudStudio 工作区产物
        env:
          KEEPALIVE_DOMAIN: ${{ secrets.KEEPALIVE_DOMAIN }}
          SPACE: ${{ steps.discover.outputs.first }}
        run: |
          npm install --no-save puppeteer-core@23 > /dev/null 2>&1
          DOMAIN="${KEEPALIVE_DOMAIN#https://}"
          node .github/scripts/ide-exec.js "https://$DOMAIN/ide/$SPACE" "$(which google-chrome)" \
            --cmd "pkill -f selfheal; pkill -f new-api; pkill -f cloudflared; pkill -f cf-probe; sleep 2; echo STEP1_DONE" \
            --cmd "rm -rf /workspace/programming-language-demo/apps/new-api; rm -f /workspace/.vscode/preview.yml /workspace/programming-language-demo/.vscode/preview.yml; echo STEP2_DONE" \
            --cmd "echo CLEANUP_OK; ps aux | grep -E 'new-api|cloudflared|cf-probe|selfheal' | grep -v grep; echo '--- apps ---'; ls /workspace/programming-language-demo/apps/ 2>/dev/null; echo '--- vscode ---'; ls -la /workspace/.vscode/ 2>/dev/null; echo CLEANUP_END" \
            --expect "CLEANUP_OK" \
            --dump

      # 再清 CF(Worker/route/DNS),顺序必须在工作区之后
      - name: 清理 Cloudflare 产物
        env:
          CF_AUTH_EMAIL: ${{ secrets.CF_AUTH_EMAIL }}
          CF_GLOBAL_API_KEY: ${{ secrets.CF_GLOBAL_API_KEY }}
          KEEPALIVE_DOMAIN: ${{ secrets.KEEPALIVE_DOMAIN }}
        run: python3 .github/scripts/cf-cleanup.py
